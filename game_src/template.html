<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>قرية العبيدية</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#title{font-size:16px;font-weight:800}
#phase{font-size:11px;opacity:.75;margin-top:2px}
#fps,#info{direction:ltr;text-align:left;font-size:11px;opacity:.85;margin-top:4px}
#info{margin-top:1px;opacity:.65}
#btns{display:flex;flex-direction:column;gap:4px;pointer-events:auto}
#btns button{padding:5px 12px;border-radius:12px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;font-family:inherit}
#btns button:active{filter:brightness(1.6)}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:0;right:0;text-align:center;font-size:11px;opacity:.7;pointer-events:none;text-shadow:0 1px 3px #000}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f16;font-size:20px;font-weight:700;z-index:30}
#err{display:none;position:fixed;left:8px;right:8px;bottom:8px;background:rgba(160,20,20,.9);padding:8px 12px;border-radius:10px;font-size:12px;z-index:40;direction:rtl}
/* وضع اللعب */
.pl{display:none}
body.mode-play .pl{display:block}
body.mode-play #btns,body.mode-play #hint,body.mode-play #title,body.mode-play #phase,body.mode-play #info{display:none}
body.mode-view #ctrl{display:none}
#ctrl{position:fixed;inset:0;touch-action:none;z-index:5}
#stickBase{display:none;position:fixed;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);pointer-events:none;z-index:6}
#stickKnob{position:absolute;left:30px;top:30px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.5)}
.rb{position:fixed;z-index:10;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.38);color:#fff;font-family:inherit;font-weight:700;touch-action:none;padding:0}
.rb:active{background:rgba(255,255,255,.35)}
#bJump{width:74px;height:74px;font-size:14px;right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
#bUse{width:64px;height:64px;font-size:13px;right:calc(env(safe-area-inset-right,0px) + 116px);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);opacity:.45}
#bUse.on{opacity:1;background:rgba(210,160,40,.75);border-color:#ffe08a}
#bMenu{width:42px;height:42px;font-size:20px;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px)}
#cross{position:fixed;z-index:4;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 3px #000;pointer-events:none}
#prompt{position:fixed;z-index:7;left:50%;top:58%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:5px 14px;border-radius:12px;font-size:14px;pointer-events:none;display:none}
#menu{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);align-items:center;justify-content:center}
#menu.open{display:flex}
#menu .card{background:rgba(24,28,36,.96);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:300px}
#menu h3{grid-column:1/3;margin:0 0 4px;text-align:center;font-size:16px}
#menu button{padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:14px;font-family:inherit}
#menu button:active{background:rgba(255,255,255,.3)}
#menu .wide{grid-column:1/3}
</style>
</head>
<body class="mode-play">
<canvas id="c"></canvas>
<div id="ctrl"></div>
<div id="stickBase"><div id="stickKnob"></div></div>
<div id="cross" class="pl"></div>
<div id="prompt"></div>
<button id="bJump" class="rb pl">قفز</button>
<button id="bUse" class="rb pl">فتح</button>
<button id="bMenu" class="rb pl">☰</button>
<div id="hud">
  <div><div id="title">قرية العبيدية</div><div id="phase">المرحلة 5 — عارض التضاريس</div><div id="fps"></div><div id="info"></div></div>
  <div id="btns"><button id="p">العودة للعب</button><button id="v">المنظر</button><button id="h">منزل</button><button id="c2">قطع الأسطح</button><button id="d">الأبواب القريبة</button><button id="a">جولة تلقائية</button><button id="q">الجودة</button></div>
</div>
<div id="hint">اسحب للدوران · إصبعان للتقريب · «منزل» ثم «قطع الأسطح» لرؤية الغرف</div>
<div id="menu"><div class="card">
  <h3>قرية العبيدية</h3>
  <button id="mResume" class="wide">متابعة</button>
  <button id="mRespawn">العودة لبداية القرية</button><button id="mQuality">الجودة</button>
  <button id="mFps">عدّاد FPS</button><button id="mView">وضع المعاينة</button>
</div></div>
<div id="loading">جارٍ بناء القرية…</div>
<div id="err"></div>
<script>
/*JS*/
</script>
</body>
</html>
